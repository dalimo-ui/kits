name: Release

# Trigger workflow on push to main branch
on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # 3️⃣ Install dependencies using npm
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Run Changesets Action
      - name: Create Release / Publish
        uses: changesets/action@v1
        with:
          publish: npm publish --workspaces --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
